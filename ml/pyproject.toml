[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dip-core"
version = "0.1.0"
description = "Deep Image Prior for Thermal Image Restoration (Denoising and Inpainting)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.22.0",
    "scikit-image>=0.19.0",
    "opencv-python>=4.7.0",
    "scipy>=1.9.0",
    "matplotlib>=3.5.0",
    "pandas>=1.5.0",
    "pillow>=9.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["dip_core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
